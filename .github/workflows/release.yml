name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 태그와 배포물의 버전이 어긋나면 되돌릴 수 없는 잘못된 라벨이 남는다.
      - name: 태그와 package.json 버전 일치
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "태그 $tag ≠ package.json $pkg"
            exit 1
          fi

      - name: 컴파일(tsc -noEmit + 번들)
        run: npm run compile

      - name: 린트
        run: npm run lint

      - name: 단위 테스트
        run: npm run test:unit

      # 통합 테스트(xvfb)는 여기서 돌리지 않는다 — 태그가 가리키는 커밋은 main CI가 이미 통과한 것이고,
      # 릴리스 잡의 목적은 그 커밋에서 재현 가능한 .vsix를 만드는 것이다.
      - name: 패키징
        run: npm run package

      - name: CHANGELOG에서 이 버전 절 추출
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$tag]" 'index($0, hdr)==1 {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG에 [$tag] 절이 없다"
            exit 1
          fi
          echo "" >> notes.md
          echo "전체 변경 이력은 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)에 있습니다." >> notes.md

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
